mage\",\"url\":\"https://cdn.sanity.io/images/4zrzovbb/website/701946d96f607f199fd7d65c8f5e2f50bf9336e4-1200x630.png\",\"alt\":\"Project Deal: our Claude-run marketplace experiment\"},\"eyebrow\":{\"label\":\"Agents\",\"href\":\"/search?topic=agents\"},\"tooltip\":{\"headline\":\"Related articles\",\"articleGraph\":{\"id\":\"8a8e9322-5133-461e-8298-989be332d68f\"},\"cards\":[{\"articleId\":\"8a8e9322-5133-461e-8298-989be332d68f\",\"eyebrow\":\"Currently viewing\",\"text\":\"Project Deal: our Claude-run marketplace experiment\",\"linkHref\":\"/features/project-deal\"}]}},{\"key\":\"75ef39ccf734\",\"title\":\"The first AI-planned drive on Mars\",\"description\":\"The first AI-assisted drive on another planet. Claude helped NASA's Perseverance rover travel four hundred meters on Mars.\",\"date\":\"2026-01-24\",\"href\":\"/features/claude-on-mars\",\"cta\":{\"label\":\"Read more\",\"href\":\"/features/claude-on-mars\",\"openInNewTab\":null},\"media\":{\"kind\":\"image\",\"url\":\"https://cdn.sanity.io/images/4zrzovbb/website/abd2e56dedd42b609ec27783edba421fa2bfee4e-1200x630.png\",\"alt\":\"The first AI-planned drive on Mars\"},\"eyebrow\":{\"label\":\"Features\",\"href\":\"/news/features\"},\"tooltip\":{\"headline\":\"Related articles\",\"articleGraph\":{\"id\":\"f04626b0-ae6f-48f8-be74-21eb98be7f7c\"},\"cards\":[{\"articleId\":\"f04626b0-ae6f-48f8-be74-21eb98be7f7c\",\"eyebrow\":\"Currently viewing\",\"text\":\"The first AI-planned drive on Mars\",\"linkHref\":\"/features/claude-on-mars\"}]}}],\"theme\":\"$undefined\",\"layout\":\"inset\",\"topBarText\":\"Features\"}]\n44:Tf85,Dr. Christopher Stubbs, an experimental physicist and former Dean of Science at Harvard University, has joined Anthropic’s Long-Term Benefit Trust. He brings to the Trust decades of scientific expertise across observational cosmology and precision measurement. He has also advised the US government on national security and arms control.  “I am honored to join Anthropic’s Long-Term Benefit Trust and to help the company deliver on its public benefit mission,” said Stubbs. “I use AI tools in my research every day and see what they make possible, and as an educator I have confronted some of the hard questions they raise. As a grandfather, I want to help ensure that AI is developed and deployed for the long-term benefit of humanity.” Stubbs is the Samuel C. Moncher Professor of Physics and of Astronomy at Harvard, where he served as Dean of Science from 2018 to 2024. In 1998, as a member of the High-Z Supernova Search Team, he helped discover the accelerating expansion of the universe, work that later earned the team the Breakthrough Prize in Fundamental Physics. He was also the inaugural project scientist for what is now the Vera C. Rubin Observatory, which started a 10-year survey of the southern sky in June. One of its aims is to study the accelerating expansion he helped discover. More recently, he’s written about how to keep AI-assisted research reproducible when models can give different answers to the same question. He’s a member of JASON, an independent group of scientists who have advised the US government on defense and technology since 1960. \"When Chris found evidence that the universe was expanding at a rate no one expected, he and his team followed the data even when it went against the prevailing wisdom of the field. As AI starts to transform how science itself is done, Chris’s intellectual honesty, rigor, and commitment to the truth are the values we want shaping the future of this technology, and I’m grateful he’s bringing his deep expertise to the Trust,\" said Daniela Amodei, Co-founder and President of Anthropic. Anthropic is a Public Benefit Corporation, which means we’re structured to balance commercial growth with our public benefit purpose. The Trust exists to help us hold that balance over the long term. It has the authority to appoint a majority of Anthropic’s board, and Trustees advise the board and our leadership on critical decisions, particularly those involving risks and societal impacts of AI.  This week we published our first Public Benefit Report [link], a public account of how we’re working toward our mission and where we’re falling short. The Trustees helped define the five mission pillars it measures us against, and the report closes with their assessment of our progress to date. Subject to stockholder approval, we’ve also committed to setting aside a portion of Anthropic’s shares to Anthropic Public Benefit Fund, a new entity with a structure that increases the stake as the company grows.  “Anthropic's Public Benefit Report sets out what we’re all working toward: helping the world build powerful AI safely, and making sure the technology drives advances that meaningfully improve people’s lives and society as a whole,” added Neil Buddy Shah, Chair of the Long-Term Benefit Trust. “Both goals depend on a deep understanding of frontier science and leading with integrity. Not only has Chris worked on some of the hardest problems in science, but he has consistently been a high-integrity leader of large, complex, collaborative scientific endeavors across academia, government, and the national laboratories. That will be of great value to the Trust as we support Anthropic in developing AI for the long-term benefit of humanity.” Stubbs, the Trust’s first physicist, joins Shah, national security expert Richard Fontaine, and former Federal Reserve Chair Ben Bernanke. Trustees are independent of the company’s management and investors. 1a:[\"$\",\"section\",null,{\"className\":\"_9T-FmG_container\",\"children\":[[\"$\",\"$L41\",null,{}],[\"$\",\"$L43\",null,{\"door\":{\"kind\":\"news\"},\"options\":{\"articleType\":\"news\",\"availableViews\":[\"table\"],\"defaultSort\":\"newest\",\"defaultView\":\"table\",\"showImages\":false},\"hasFeaturedItems\":false,\"articleCount\":283,\"initialPage\":{\"posts\":[{\"_id\":\"0c98d5f1-9776-47c3-ae13-49c06cf21cce\",\"_type\":\"article\",\"_updatedAt\":\"2026-10-29T
