name = "aiwatch-worker"
workers_dev = true
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Vercel preview deployments rotate per branch+commit, so they're matched via
# a team-scoped suffix pattern — never use the global `*.vercel.app`, which
# would let any Vercel tenant call the API.
ALLOWED_ORIGIN = "https://ai-watch.dev,https://www.ai-watch.dev,https://aiwatch-dev.vercel.app,*-bentleys-projects-5f6a1a8c.vercel.app"
# Local dev override: create worker/.dev.vars with ALLOWED_ORIGIN=*

[[kv_namespaces]]
binding = "STATUS_CACHE"
id = "e49508d80bb144e9a7ff872f2be771a4" # Not a secret — KV namespace IDs are public identifiers, inaccessible without API token

[ai]
binding = "AI"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
# Named for its first use (#494, statusline presets); it now carries every WAE counter in the worker,
# this being the only dataset. Read via the SQL REST API, not GraphQL.
dataset = "aiwatch_statusline"

# #955 — without this, `console.error`/`console.warn` are emitted and immediately lost, so a
# silently-failing AI path (a retired model id 404ing for weeks) is undiagnosable after the
# fact: the only evidence was a `failed` tally in the daily summary with no reason attached.
# Sampling stays at 100% — worker log volume is a handful of lines per 5-minute cron.
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *"]
