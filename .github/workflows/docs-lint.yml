name: Docs Lint

# #961 — the OKF structural lint that guards `docs/reference/` was never gated on a docs change.
#
# `test.yml` sets `paths-ignore` for `docs/**` / `*.md` on BOTH its triggers, and `paths-ignore` is
# evaluated at the WORKFLOW level — so a docs-only PR started no jobs at all. The lint
# (`scripts/lint-okf-bundle.mjs`) only ever ran inside that workflow's `unit` job via
# `npm run test:scripts`, i.e. on every PR that does NOT touch docs, and never on the ones that do.
# Same shape as #877, where a conditional job let PR #871's CSP-hash drift ship green.
#
# Dropping `paths-ignore` from `test.yml` is the wrong fix: it would run the worker unit tests, tsc,
# Playwright E2E and the bundle build on every one-line doc edit. That filter is doing its job. This
# workflow instead fires on exactly the paths `test.yml` ignores, so a mixed code+docs PR triggers
# both and every PR is gated by exactly the checks its diff needs.
#
# `lint-okf-bundle.mjs` imports only `node:fs` / `node:path` / `node:url`, so there is no `npm ci`
# step — the job is a few seconds of runner time.
#
# ⚠️ DO NOT make `Docs Lint` a REQUIRED status check on `main`.
# A workflow-level `paths:` filter means the workflow does not RUN on a code-only PR, so its check
# context is never reported — and a required check that never reports blocks the merge forever.
# (A job-level `if:` skip is different: it reports `skipped`, which satisfies a required check.)
# `test.yml` carries the same shape via its `paths-ignore`, so this applies to its four jobs too.
# As of 2026-07-09 `main` has NO required status checks, so the trap is latent, not live.
# If you ever want these required, first move the path decision from the workflow trigger into the
# job (always run the workflow; skip each job's step when no docs changed). There are FOUR jobs here
# now — `Service Count Lockstep`, `Doc Symbol Lint` and `Instruction Budget` are further contexts that
# likewise never report on a code-only PR, so all three need converting. Note that doing so removes the `paths:` list that
# `scripts/workflow-paths-sync.test.mjs` asserts against, so that guard would need rewriting too.

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.github/**/*.md'
      - 'scripts/lint-okf-bundle.mjs'      # the guard guards itself
      - 'scripts/check-doc-symbols.mjs'    # #1100 — ditto, the doc-symbol lint
      - 'scripts/check-instruction-budget.mjs'   # #1285 — ditto, the instruction-budget ratchet
      - 'api/__tests__/service-count-lockstep.test.ts'   # ditto, for the count lockstep
      - 'vitest.config.js'                 # passWithNoTests there would disarm the lockstep gate
      - '.github/workflows/docs-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.github/**/*.md'
      - 'scripts/lint-okf-bundle.mjs'
      - 'scripts/check-doc-symbols.mjs'
      - 'scripts/check-instruction-budget.mjs'
      - 'api/__tests__/service-count-lockstep.test.ts'
      - 'vitest.config.js'
      - '.github/workflows/docs-lint.yml'

permissions:
  contents: read

# Mirrors test.yml: a new push on the same head_ref cancels the previous run instead of stacking.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  okf-lint:
    name: OKF Bundle Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10   # #1253 — never inherit the 6h default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero-dependency script (node: builtins only) — deliberately no `npm ci`.
      # Checks: frontmatter integrity, unquoted-`#` truncation, dangling cross-links, index.md drift.
      - run: node scripts/lint-okf-bundle.mjs

  count-lockstep:
    name: Service Count Lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 10   # #1253 — never inherit the 6h default
    # #1081 — #1074's guard pins the service count / category breakdown / probe count / OSV package
    # count across six files, THREE of which are README.md, README.ko.md and CLAUDE.md. It only ran
    # inside test.yml's `Frontend Unit Tests` job, and test.yml paths-ignores exactly those files at
    # the WORKFLOW level — so a README-only edit started no jobs and a wrong count merged green.
    # Verified before the fix: breaking README.md's count left `lint-okf-bundle.mjs` PASSING (it reads
    # only docs/reference/) while test.yml never started. Same shape as #877 and #961: a guard that
    # exists but is not wired to the diffs it guards.
    #
    # Unlike the OKF job above this one cannot be dependency-free: the test is TypeScript run under
    # vitest, and it renders the two Edge templates (which pull in the api/_shared subtree). The
    # worker constants it reads — GROUP_MEMBERS / PROBE_TARGETS / OSV_PACKAGES — are NOT the reason;
    # those three modules have zero imports between them. Reimplementing the checks as a zero-dep
    # node:test script would mean re-declaring the counts away from those constants, which is exactly
    # the drift #1074 exists to kill. So docs PRs pay an `npm ci`; `cache: 'npm'` blunts it.
    #
    # Runs ONLY the lockstep file, not `npm run test:src` — the rest of that suite is gated by
    # test.yml on code PRs, and re-running it here would duplicate ~4s of unrelated work on every
    # doc edit for no added coverage.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci --no-audit --fund=false
      - run: npx vitest run --config vitest.config.js api/__tests__/service-count-lockstep.test.ts

  doc-symbols:
    name: Doc Symbol Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10   # #1253 — never inherit the 6h default
    # #1100 — a symbol cited in CLAUDE.md / docs/reference that is absent from source — the #1076
    # invented-symbol shape, a doc citing a renamed/nonexistent function — fails here. Lives in docs-lint (not just test.yml's
    # test:scripts) because the invented-symbol case is introduced by a DOCS edit, which test.yml
    # paths-ignores — the same gap #961 fixed for the OKF lint. The complementary case (a CODE rename
    # that orphans a doc ref) is caught by the real-repo assertion in check-doc-symbols.test.mjs,
    # which runs under test:scripts on code PRs. Zero-dependency (node: builtins) → no `npm ci`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-doc-symbols.mjs

  instruction-budget:
    name: Instruction Budget
    runs-on: ubuntu-latest
    timeout-minutes: 10   # #1253 — never inherit the 6h default
    # #1285 — the ratchet on ALWAYS-loaded agent context (CLAUDE.md + the per-turn gate injection).
    # Wired here for the doc-symbols reason: test.yml paths-ignores CLAUDE.md, so the PR shape that
    # moves this budget starts none of that workflow's jobs. `test:scripts` runs the same real-set
    # assertion on code PRs, covering the other always-loaded file (not a docs path).
    # Zero-dependency (node: builtins) → no `npm ci`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-instruction-budget.mjs
