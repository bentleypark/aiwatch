name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.github/**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.github/**/*.md'

# Bound CI quota usage per PR — a new push on the same head_ref cancels the previous run instead of
# stacking. Mitigates abuse surface after Vercel Git Fork Protection is disabled (#365).
#
# #1254 — a push to main must never be cancelled: its run is the only post-merge verdict that commit
# gets, and no later push's diff range reaches back to cover it. `github.head_ref` is empty on a
# push, so falling back to `run_id` puts every main push in a group of ONE — it can neither cancel,
# be cancelled, nor queue behind another. Conditioning `cancel-in-progress` instead would only save a
# RUNNING run: GitHub cancels a PENDING one when the next arrives, so a burst still loses its middle
# (4 pushes in 19s on 2026-05-31, 3 cancelled; same shape on 2026-06-01 and 2026-06-21).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    name: Worker Unit Tests
    runs-on: ubuntu-latest
    # #1253 set this to 10 so a hung job could not inherit GitHub's 6h default. #1348 raises it,
    # recorded rather than bumped silently, for the reason every cap-kill examined shows: no single
    # step reached 8m in any of them — 33842800905 installed for 421s then 185s, 33846442889 for
    # 200s then 321s, 33868432498 for 196s then 383s — so the job died on the SUM of steps that were
    # each merely slow, and no per-step cap could have caught it. 18m lets that shape finish.
    # #1253's invariant, that no job inherits 6h, is unchanged.
    #
    # Checkout, setup-node (which now also restores and saves a cache) and the two short
    # deterministic steps carry no cap of their own; a stall there still ends as an anonymous kill.
    timeout-minutes: 18
    # No `if:` — the previous one ended in a literal `|| true`, so it was a tautology that only made
    # the job LOOK conditional. Removed with #1285, which needs this job to be provably unskippable:
    # `npm run test:scripts` below is what runs scripts/check-instruction-budget.test.mjs.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # #1348 — cache ~/.npm. An uncached `npm ci` refetches the whole tree from the registry
          # every run, and that fetch, not the suite, is what put this job in a 4-10 minute band
          # against a 10m cap. The measurement and its two controls are written ONCE, in the #1348
          # block of scripts/ci-workflow-timeouts.test.mjs, which also asserts this line stays.
          #
          # BOTH lockfiles, because this job installs from both. A key hashed over the root one
          # alone would restore a cache holding none of worker/'s tarballs and — since a cache HIT
          # never saves — never correct itself: the green-forever/cache-dead-forever shape the
          # Playwright version pin in that same file exists to prevent.
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      # #1348 — bound so a stalled install fails AS `npm ci`, named in the annotation, instead of
      # spending the job's budget until the cap kills whichever step happened to be running.
      #
      # ONE number for every `npm ci` here, deliberately not sized per step: it is an ATTRIBUTION
      # bound, not a budget. It has only to clear installs that are merely slow — the longest
      # observed is 422s — and fail the ones that are stuck. Measurement in the #1348 block of
      # scripts/ci-workflow-timeouts.test.mjs.
      - run: npm ci
        timeout-minutes: 8
      # #533 Phase 4: the type-check gate type-checks worker source, which imports worker-only
      # runtime deps (@resvg/resvg-wasm) + worker type packages (@cloudflare/workers-types,
      # @types/node) that live in worker/node_modules. Root `npm ci` doesn't install them (no
      # workspaces), so install the worker package here or tsc fails with TS2307/TS2688.
      - run: npm ci --prefix worker
        timeout-minutes: 8
      # #1348 — bounded for the OTHER direction, so a suite that genuinely hangs is attributable and
      # not only the installs. Same number as the installs for the same reason: it bounds a hang, and
      # is not a budget derived from how long this step actually takes. It is the LAST bounded step,
      # so two slow installs can still spend the job's budget ahead of it and end the run as an
      # anonymous kill — the sum of the three bounds exceeds the job cap and is not claimed to fit.
      - run: npm run test:worker
        timeout-minutes: 8
      # #533: full `tsc --noEmit` gate (Phase 4) — fails on ANY type error across worker source
      # incl tests; prod pass is workers-types-only so a node-API use (no nodejs_compat → runtime
      # crash, the #532 class) also fails. Two passes (prod strict / tests with @types/node).
      - run: npm run typecheck:worker
      # #541: node:test unit tests for scripts/*.mjs (verify-reminders parse/fire logic)
      - run: npm run test:scripts

  # #1238 — the monitor suite varies the SHELL but not the utilities, and `awk` is the one the
  # script leans on hardest: it is the row validator, the splitter and the severity lookup. The
  # implementations genuinely disagree — BWK awk and gawk expand escapes in an `awk -v` value,
  # mawk does not — and that difference already cost this script a permanently-mute failure mode.
  # Running the suite under each turns "we reasoned about mawk vs gawk in a comment" into
  # something CI fails on. Zero-dependency (node: builtins only), so no `npm ci`.
  awk-matrix:
    name: Monitor Suite (${{ matrix.awk }})
    runs-on: ubuntu-latest
    # #1253 — this job's apt step hit the same stall class as the Playwright install (~22m with no
    # output, then a manual cancel); the legs that find their awk already installed skip apt entirely.
    timeout-minutes: 10
    strategy:
      # Not fail-fast: which awks disagree is the whole signal, so one red must not hide the rest.
      fail-fast: false
      matrix:
        awk: [original-awk, mawk, gawk]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # Only when missing. `mawk` IS ubuntu's default awk, and re-installing the package that owns
      # /usr/bin/awk drops apt into a debconf prompt that `-y` does not answer — the job then hangs
      # until the runner times out, with the suite never reached (observed on the first run of this
      # matrix). DEBIAN_FRONTEND is belt-and-braces for the two that do need installing.
      - name: Ensure ${{ matrix.awk }} is present
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          command -v ${{ matrix.awk }} >/dev/null && exit 0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.awk }}
        timeout-minutes: 5   # #1253 — the apt stall must fail this step, not hold the job
      # Shimmed onto PATH rather than via update-alternatives, so this job pins WHICH
      # implementation ran instead of inheriting whatever the image's `awk` currently points at.
      - name: Shim ${{ matrix.awk }} as `awk`
        run: |
          set -eu
          bin=$(command -v ${{ matrix.awk }})
          mkdir -p /tmp/awkshim && ln -sf "$bin" /tmp/awkshim/awk
          echo "$bin"
      - run: PATH=/tmp/awkshim:$PATH node --test scripts/plugin-monitor.test.mjs

  src-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10   # #1253 — never inherit the 6h default
    # #877: gate the frontend vitest suite (~750 tests incl. the CSP drift pin
    # api/__tests__/csp-headers.test.ts, which caught PR #871's vercel.json script-src
    # hash drift). ALWAYS-ON, no path gate: the CSP pin can break from vercel.json /
    # index.html / api/ / src/ — the e2e+build frontend detector regex matches none of
    # vercel.json or api/, so any path gate would re-open the blind spot. Suite runs ~4s.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # #1348 — an uncached `npm ci` is a registry-bound step with no bound; every job in this
          # file that runs one slowed together. Root lockfile only: this job does not install
          # worker/. Measurement in scripts/ci-workflow-timeouts.test.mjs.
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
        timeout-minutes: 8
      - run: npm run test:src

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15   # #1253 — a stalled browser install must fail, not hang on the 6h default
    steps:
      - uses: actions/checkout@v7
        with:
          # #1254 — the push base can be any distance back; see scripts/ci-detect-frontend.sh.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # #1348 — an uncached `npm ci` is a registry-bound step with no bound; every job in this
          # file that runs one slowed together. Root lockfile only: this job does not install
          # worker/. Measurement in scripts/ci-workflow-timeouts.test.mjs.
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
        timeout-minutes: 8
      - name: Check for frontend changes
        id: changes
        # #998 — `tests/` + `playwright` MUST be here: without them a tests-only PR (e.g. one that
        # rewrites the e2e suite) skips the E2E job entirely, so the very code it changes never runs
        # in CI and a broken fixture merges green. #1253/#1254 — `.github/workflows/` too: this job's
        # own browser-install step lives there.
        #
        # Two asymmetries this buys, both deliberate and neither free:
        #  - the `build` job matches none of the three, so a change to ITS OWN `Verify bundle
        #    splitting` step below does not run it — including this commit;
        #  - the term is `.github/workflows/`, not `…/test\.yml`, so editing docs-lint.yml or
        #    edge-e2e.yml also pays a full Playwright install and run.
        run: bash scripts/ci-detect-frontend.sh '^(src/|tests/|playwright|public/|index\.html|vite\.config|package\.json|\.github/workflows/)'
        env:
          PUSH_BASE: ${{ github.event.before }}
      - name: Cache Playwright browsers
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.58.2-${{ runner.os }}
      # #1253 — install only the browser. `--with-deps` enters apt on every run and intermittently
      # stalls in that phase; the browser cache is independent of it.
      - name: Install Playwright
        if: steps.changes.outputs.frontend == 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Run E2E tests
        if: steps.changes.outputs.frontend == 'true'
        run: npm test
      - name: Skip E2E (worker-only changes)
        if: steps.changes.outputs.frontend != 'true'
        run: echo "Skipped — no frontend changes detected"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10   # #1253 — never inherit the 6h default
    steps:
      - uses: actions/checkout@v7
        with:
          # #1254 — the push base can be any distance back; see scripts/ci-detect-frontend.sh.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # #1348 — an uncached `npm ci` is a registry-bound step with no bound; every job in this
          # file that runs one slowed together. Root lockfile only: this job does not install
          # worker/. Measurement in scripts/ci-workflow-timeouts.test.mjs.
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
        timeout-minutes: 8
      - name: Check for frontend changes
        id: changes
        run: bash scripts/ci-detect-frontend.sh '^(src/|public/|index\.html|vite\.config|package\.json)'
        env:
          PUSH_BASE: ${{ github.event.before }}
      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
      - name: Verify bundle splitting
        if: steps.changes.outputs.frontend == 'true'
        run: |
          set -e
          # chart.js must be in a separate chunk
          CHART_CHUNK=$(ls dist/assets/chart-*.js 2>/dev/null)
          if [ -z "$CHART_CHUNK" ]; then
            echo "::error::chart.js chunk not found — code splitting may be broken"
            exit 1
          fi
          echo "✓ chart.js chunk: $(du -h "$CHART_CHUNK" | cut -f1)"

          # Main bundle should be under 400KB
          MAIN_CHUNK=$(ls dist/assets/index-*.js)
          MAIN_SIZE=$(stat -c%s "$MAIN_CHUNK" 2>/dev/null || stat -f%z "$MAIN_CHUNK")
          echo "✓ Main bundle: $(echo "$MAIN_SIZE / 1024" | bc)KB"
          if [ "$MAIN_SIZE" -gt 409600 ]; then
            echo "::warning::Main bundle exceeds 400KB ($MAIN_SIZE bytes) — consider further splitting"
          fi
      - name: Skip build (worker-only changes)
        if: steps.changes.outputs.frontend != 'true'
        run: echo "Skipped — no frontend changes detected"
