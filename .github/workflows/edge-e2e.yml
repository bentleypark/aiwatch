# #570 — run the Edge-SSR e2e (is-down / intro / reports / consent) against the
# Vercel Preview deployment for each PR/push, since the normal `npm test` CI job
# only covers the Vite desktop/mobile projects (the Edge projects need a deployed
# Edge runtime). Triggered by Vercel's deployment_status, so it runs the moment the
# preview is ready and points Playwright at the real preview URL (no vercel dev in CI).
name: Edge E2E

on:
  deployment_status: {}

# Least privilege: this only checks out + runs tests against a remote URL.
permissions:
  contents: read

# One run per deployment URL; cancel a superseded preview's run.
concurrency:
  group: edge-e2e-${{ github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  edge-e2e:
    name: Edge E2E (Vercel Preview)
    # Only successful deployments that actually expose a URL (Vercel fires several
    # statuses per deploy — building/error/ready; the ready one carries the URL).
    # Preview-only: Edge E2E is a pre-merge PR gate. The #570 verify-after confirmed
    # Vercel sends environment == 'Preview' for PR deploys and 'Production' for main
    # deploys (capitalized), so we filter to 'Preview'. This drops the redundant
    # post-merge run against the production deployment — its only effect was a second
    # green run per merge, and a transient prod blip there would have shown as a
    # confusing main-branch red that isn't a code regression. Prod health is covered
    # by the app's own monitoring, not this gate.
    if: >-
      github.event.deployment_status.state == 'success'
      && github.event.deployment_status.environment_url != ''
      && github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    # #1253 — this job had no timeout, so a stalled step hung on GitHub's 6-hour default. A job timeout
    # ends the run as `cancelled`, which this repo produces routinely via cancel-in-progress; the step
    # timeouts below are what a stall should hit first.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Test the same commit that was deployed, so the spec files match the preview.
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.58.2-${{ runner.os }}
      # #1253 — install only the browser. `--with-deps` enters apt on every run and intermittently
      # stalls on the runner's Ubuntu mirror; the browser cache is independent of that apt phase.
      - name: Install Chromium
        run: |
          npx playwright install chromium
      - name: Wait for the deployment to be reachable (cold-start guard)
        env:
          EDGE_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # #570: Vercel Preview Deployment Protection returns 401 to anonymous requests.
          # This single-origin curl can safely carry the bypass as a header (it never
          # fans out cross-origin); Playwright uses a cookie instead (edge-bypass-setup.js).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # #1253 — curl has no default TOTAL timeout (only `--connect-timeout`, 300s), so a connected
          # but silent origin can outlast the loop and it never reaches its own `::error::` exit.
          # `-sS` keeps curl's error text, which plain `-s` suppresses.
          for i in $(seq 1 10); do
            code=$(curl -sS --max-time 15 --connect-timeout 5 -o /dev/null -w "%{http_code}" \
              -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$EDGE_BASE_URL/intro") || true
            echo "attempt $i: GET /intro -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "::error::preview not reachable after retries"; exit 1
      - name: Run Edge E2E against the Vercel preview
        env:
          # Drives the Edge projects' baseURL in playwright.config.js (#570) and skips
          # the local Vite webServer.
          EDGE_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # Consumed by globalSetup to mint a preview-scoped bypass cookie (#570).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:edge
      # #1253 — `failure()` is false for a cancelled run, so a job timeout dropped the one diagnostic
      # artifact. `if-no-files-found: ignore` keeps a superseded run (cancel-in-progress) from warning
      # about the report directory it never created.
      - name: Upload Playwright report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: edge-e2e-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
